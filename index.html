function resetCurrent(){const d=activeData();if(!d){alert('กรุณาเลือกผู้เล่นก่อน');return}if(!confirm('เริ่มใหม่สำหรับ '+d.name+'? คะแนน ตราประทับ และเกมที่ค้างของผู้เล่นคนนี้จะถูกลบ (ผู้เล่นอื่นไม่ถูกลบ)'))return;d.records={};d.progress=null;game=null;persist();go('home')}
function resumeGame(){const d=activeData();if(!d?.progress)return;game=d.progress;difficulty=game.difficulty;go('game')}
function saveMenu(){return `<details class="save-menu"><summary>💾 จัดการข้อมูลผู้เล่นและไฟล์สำรอง</summary><p class="small">บันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ • ส่งออกเป็นไฟล์ TPQ_ชื่อ_วันเวลา.json เพื่อสำรองหรือย้ายเครื่อง</p><label for="profilePicker">สลับผู้เล่นที่บันทึกไว้</label><select id="profilePicker" onchange="chooseProfile()"><option value="">เลือกผู้เล่น</option>${Object.entries(allProfiles).map(([k,v])=>`<option value="${escapeHTML(k)}" ${k===activeKey?'selected':''}>${escapeHTML(v.name)} (${escapeHTML(v.grade)})</option>`).join('')}</select><div class="save-actions"><button class="secondary" onclick="exportSave()">⬇️ ส่งออกข้อมูล</button><label class="secondary import-label">⬆️ นำเข้าข้อมูล<input type="file" accept=".json,application/json" onchange="importSave(this)" hidden></label><button class="secondary danger" onclick="resetCurrent()">↻ เริ่มใหม่เฉพาะคนนี้</button></div></details>`}
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function makeRound(){const bank=difficulty==='easy'?wordBank:extraBank[difficulty];const choices=shuffle(bank.filter(q=>q.mode==='choice')).slice(0,5).map(q=>({...q,opts:shuffle(q.opts)}));const tiles=shuffle(bank.filter(q=>q.mode==='tiles')).slice(0,5).map(q=>({...q,tiles:shuffle(q.tiles)}));return [...choices,...tiles]}
function medal(score){return score===1000?'🥇 เหรียญทอง':score>=800?'🥈 เหรียญเงิน':score>=600?'🥉 เหรียญทองแดง':'🌱 ฝึกต่อ'}
function medalIcon(score){return score===1000?'🥇':score>=800?'🥈':score>=600?'🥉':'🔒'}
function overview(){return `<h3 style="margin:18px 0 7px">🏅 ความสำเร็จทั้ง 3 ระดับ</h3><div class="achievement-grid">${Object.entries(difficultyLabels).map(([level,label])=>{const r=activeData()?.records?.[level]||null;const score=r?.best||0;return `<div class="achievement ${level===difficulty?'current':''}"><div><b>${label}</b></div><div class="award">${medalIcon(score)}</div><div class="stat">${score}/1000</div><div class="detail">${r?.passed?'✅ ผ่านแล้ว':'🔒 ยังไม่ผ่าน'}</div><div class="detail">${r?.attempts||0} รอบ</div></div>`}).join('')}</div><p class="small">คะแนนและตราประทับแยกตามระดับความยาก • เหรียญแสดงจากคะแนนสูงสุดของแต่ละระดับ</p>`}
function scrollTopQuestion(){requestAnimationFrame(()=>{document.getElementById('view').scrollIntoView({behavior:'instant',block:'start'})})}
const el=document.getElementById('view');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function landscape(revealed=0){let order=[4,0,8,2,6,1,7,3,5];return `<div class="scene"><svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice"><circle cx="470" cy="90" r="42" fill="#ffe8a0"/><path d="M0 215 L120 100 235 205 325 125 470 220 570 135 640 200 640 360 0 360" fill="#568c7b"/><path d="M0 255 L125 185 255 245 390 165 520 242 640 195 640 360 0 360" fill="#275f58"/><path d="M0 315 Q140 250 310 305 T640 275 L640 360 0 360" fill="#183f3c"/><path d="M140 278 L205 245 325 260 410 235 505 264 490 288 320 290 Z" fill="#a7a38a"/><path d="M190 250 L240 220 330 232 370 213 415 234 395 245 Z" fill="#c8bba0"/><path d="M88 300 l12 -52 10 52 M560 302 l12 -66 12 66" stroke="#183f3c" stroke-width="10"/><text x="320" y="342" text-anchor="middle" fill="white" font-size="19" font-weight="bold">ภูกระดึง • เลย</text></svg><img class="scene-photo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Pha_Lom_Sak.jpg" alt="ภาพถ่ายจริงผาหล่มสัก อุทยานแห่งชาติภูกระดึง" loading="lazy" onerror="this.style.display='none'"/><div class="cover">${Array.from({length:9},(_,i)=>`<div class="${order.indexOf(i)<Math.min(revealed,9)?'open':''}">${order.indexOf(i)<revealed?'':'✦'}</div>`).join('')}</div></div><div class="photo-credit">📷 ผาหล่มสัก ภูกระดึง · ภาพ: Billybobmac (สาธารณสมบัติ) · <a href="https://commons.wikimedia.org/wiki/File:Pha_Lom_Sak.jpg" target="_blank" rel="noopener noreferrer">ที่มาภาพ</a> · หากโหลดไม่ได้จะแสดงภาพสำรอง</div>`}
function go(p){page=p;render();scrollTopQuestion()}
function start(){if(!switchProfile(document.getElementById('nickname').value,document.getElementById('grade').value))return;game={idx:0,score:0,correct:0,answers:[],selected:null,tiles:[],checked:false,questions:makeRound(),difficulty};saveProgress();go('game')}
function choose(i){if(!game.checked){game.selected=i;saveProgress();render()}}
function addTile(i){if(!game.checked&&!game.tiles.includes(i)){game.tiles.push(i);saveProgress();render()}}
function removeTile(){if(!game.checked){game.tiles.pop();saveProgress();render()}}
function check(){const q=game.questions[game.idx];if(game.checked)return;if(q.mode==='choice'&&game.selected===null)return;if(q.mode==='tiles'&&!game.tiles.length)return;const good=q.mode==='choice'?q.opts[game.selected]===q.word:game.tiles.map(i=>q.tiles[i]).join('')===q.word;game.answers.push({word:q.word,correct:good});if(good){game.score+=100;game.correct++}game.checked=true;saveProgress();render()}
function next(){if(game.idx===9){const passed=game.correct>=8;justUnlocked=passed&&!activeRecord()?.passed;record=activeRecord()||{best:0,passed:false,firstStampDate:null,attempts:0};record.attempts=(record.attempts||0)+1;record.best=Math.max(record.best||0,game.score);if(passed&&!record.passed){record.passed=true;record.firstStampDate=new Date().toLocaleDateString('th-TH')}record.name=profile.name;record.grade='ป.3';storeRecord(record);const d=activeData();if(d){d.progress=null;persist()}go('result')}else{game.idx++;game.selected=null;game.tiles=[];game.checked=false;saveProgress();render();scrollTopQuestion()}}
function render(){if(page==='home'){el.innerHTML=`<div class="card"><h2>⛰️ ด่าน 01 — ภูกระดึง</h2><div class="home-scene">${landscape(0)}</div><p>สะกดคำให้ถูก 10 ข้อ • 5 ข้อเลือกคำ + 5 ข้อประกอบคำ • ผ่าน 8/10 ข้อ</p><div class="player-fields"><div><label for="nickname">ชื่อผู้เล่น</label><input id="nickname" maxlength="24" value="${escapeHTML(profile.name)}" placeholder="ชื่อนักเดินทาง"></div><div><label for="grade">ระดับชั้น</label><select id="grade">${['ป.3'].map(g=>`<option ${g===profile.grade?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="difficulty-wrap"><label for="difficulty"><b>เลือกระดับความยาก</b></label><select id="difficulty" onchange="setDifficulty(this.value)">${Object.entries(difficultyLabels).map(([k,v])=>`<option value="${k}" ${k===difficulty?'selected':''}>${v}</option>`).join('')}</select><p class="small">${difficulty==='easy'?'คำพื้นฐานสำหรับฝึกเริ่มต้น':difficulty==='medium'?'เพิ่มคำที่มักสะกดสับสน':'คำซับซ้อนสำหรับผู้ต้องการความท้าทาย'}</p></div><p class="small">🔎 รุ่นทดสอบ: ระดับละ 10 คำ สุ่มลำดับคำและตัวเลือก ยังไม่ใช่บัญชีคำ ป.3 ที่ตรวจสอบครบ และบางคำอาจสูงกว่าระดับ ป.3</p><button class="primary" onclick="start()">🚀 เริ่มผจญภัย</button>${activeData()?.progress?`<button class="secondary" style="width:100%;margin-top:8px" onclick="resumeGame()">▶ เล่นต่อจากข้อที่ค้างไว้</button>`:""}${saveMenu()}</div>`;return}
if(page==='map'){el.innerHTML=`<div class="card"><h2>🗺️ แผนที่ประเทศไทย</h2><p>รุ่นทดลอง: เปิดจังหวัดเลยเพียงแห่งเดียว และจะทยอยเพิ่มสถานที่ใหม่</p>${landscape(0)}<h3>📍 จังหวัดเลย — ภูกระดึง</h3><p class="small">ด่านทดลอง 01 • สถานที่แรกในสมุดตราประทับ</p><button class="primary" onclick="go('home')">ไปยังด่าน</button></div>`;return}
if(page==='passport'){const r=activeRecord();el.innerHTML=`<div class="card"><h2>📘 สมุดสะสมตราประทับ</h2><div class="difficulty-switch"><label>ดูสถิติระดับ</label><select onchange="setDifficulty(this.value)">${Object.entries(difficultyLabels).map(([k,v])=>`<option value="${k}" ${k===difficulty?'selected':''}>${v}</option>`).join('')}</select></div>${landscape(r?.passed?9:0)}<p><b>ผู้เดินทาง:</b> ${escapeHTML(profile.name||'ยังไม่ระบุ')}</p><p><b>ภูกระดึง:</b> ${r?.passed?'✅ ได้รับตราประทับแล้ว':'🔒 ยังไม่ผ่านด่าน'}</p><p><b>คะแนนสูงสุด:</b> ${r?.best??0}/1000 — ${medal(r?.best||0)}</p><p><b>เล่นจบแล้ว:</b> ${r?.attempts||0} ครั้ง</p><p><b>สถานที่:</b> ภูกระดึง จังหวัดเลย ภาคตะวันออกเฉียงเหนือ</p><p class="small">ภูกระดึงเป็นอุทยานแห่งชาติที่มีภูเขายอดราบและเส้นทางเดินป่า</p>${r?.passed?`<div class="passport-award"><div class="symbol">${medalIcon(r.best||0)}</div><div class="caption">เหรียญรางวัลสูงสุด ${medal(r.best||0)}</div></div><p class="center">รับตราประทับครั้งแรก ${escapeHTML(r.firstStampDate||'ไม่ทราบวันที่')}</p>`:''}${overview()}<button class="primary" onclick="go('home')">กลับไปเล่น</button>${saveMenu()}</div>`;return}
if(page==='result'){let passed=game.correct>=8;el.innerHTML=`<div class="card center"><h2>${passed?'🎉 ผ่านด่านแล้ว!':'🌱 ลองอีกครั้งนะ!'}</h2><p class="small">${difficultyLabels[game.difficulty]}</p>${landscape(passed?9:game.correct)}<h1>${game.score}/1000</h1><p>ตอบถูก ${game.correct} จาก 10 ข้อ</p><h2>${game.correct===10?'🥇 เหรียญทอง':game.correct>=8?'🥈 เหรียญเงิน':'🥉 เหรียญทองแดง'}</h2><p>${passed?(justUnlocked?'🎉 ปลดล็อกตราประทับภูกระดึงครั้งแรกแล้ว!':'✅ ผ่านด่านอีกครั้ง! ตราประทับเดิมยังอยู่ในสมุดสะสม'):'ต้องตอบถูกอย่างน้อย 8 ข้อจึงจะผ่านด่าน เล่นใหม่ได้เสมอ'}</p><p class="small">คะแนนสูงสุดสะสม ${record?.best||game.score}/1000 • เล่นจบ ${record?.attempts||1} ครั้ง</p><button class="primary" onclick="go('passport')">📘 เปิดสมุดตราประทับ</button><button class="secondary" style="width:100%;margin-top:9px" onclick="go('home')">เล่นอีกครั้ง</button></div>`;return}
if(page==='game'&&game){let q=game.questions[game.idx],n=game.idx+1,good=game.answers.at(-1)?.correct;el.innerHTML=`<div class="card"><div class="row"><b>ข้อ ${n}/10</b><span class="small">${difficultyLabels[game.difficulty]}</span><span class="pill">${q.mode==='choice'?'โหมด 1 · เลือกคำ':'โหมด 2 · ประกอบคำ'}</span></div><div class="progress" style="margin:12px 0"><div style="width:${(n-1)*10}%"></div></div><div class="game-scene">${landscape(game.correct)}</div><div class="row"><span class="small">เปิดภาพ ${Math.min(game.correct,9)}/9 ชิ้น</span><b>⭐ ${game.score}</b></div><h2>${q.mode==='choice'?'เลือกคำที่สะกดถูกต้อง':'เรียงชิ้นส่วนให้เป็นคำที่ถูกต้อง'}</h2><p>💡 คำใบ้: ${q.hint}</p>${q.mode==='choice'?q.opts.map((o,i)=>`<button class="option ${game.selected===i?'selected':''} ${game.checked&&o===q.word?'correct':''} ${game.checked&&game.selected===i&&o!==q.word?'wrong':''}" ${game.checked?'disabled':''} onclick="choose(${i})">${['ก','ข','ค'][i]}. ${o}</button>`).join(''):`<div class="answer">${game.tiles.length?game.tiles.map(i=>q.tiles[i]).join(''):'แตะชิ้นส่วนด้านล่าง'}</div><div class="tiles">${q.tiles.map((t,i)=>`<button class="tile ${game.tiles.includes(i)?'used':''}" ${game.tiles.includes(i)||game.checked?'disabled':''} onclick="addTile(${i})">${t}</button>`).join('')}</div><button class="secondary" onclick="removeTile()" ${game.checked?'disabled':''}>↶ ลบชิ้นล่าสุด</button>`}${game.checked?`<div class="feedback"><b>${good?'✅ ถูกต้อง +100 คะแนน':'❌ ยังไม่ถูกต้อง +0 คะแนน'}</b><p>คำตอบ: <b>${q.word}</b></p><span>${q.why}</span></div><button class="primary" onclick="next()">${n===10?'ดูผลคะแนน':'ข้อต่อไป →'}</button>`:`<button class="primary" onclick="check()">ตรวจคำตอบ</button>`}</div>`}}
if(allProfiles[profileKey(legacyProfile.name||'',legacyProfile.grade||'ป.3')])switchProfile(legacyProfile.name,legacyProfile.grade||'ป.3');
render();
</script></body></html>
